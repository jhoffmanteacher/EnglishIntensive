<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content-Security-Policy — identical to index.html's policy; the
     comment there explains what each directive is protecting. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>Nonsense Words — Say It Right!</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="blend-game.css">
</head>
<body>
<a class="home" href="index.html">🏠 Home</a>
<div id="app"></div>

<script src="blend-game.js"></script>
<script>
// Made-up CVC words, from the classroom nonsense-word flashcard set — pure
// decoding practice, no meaning to lean on. No blend to highlight, so this
// uses blendLength:0 (an always-empty blend) for plain whole-word matching.
BlendGame.start({
  title: "Nonsense Words 🤖",
  intro: "These are made-up words. Sound out the letters, then say the word out loud.<br>The computer listens and tells you if you're right.",
  blend: "start",
  blendLength: 0,
  theme: "race",
  words: ["jag","baz","wat","gan","vab","sab","raz","taf",
          "sem","ted","ret","heg","peb","yed","leb","ren",
          "lif","vip","pid","tix","rit","sig","lim","din",
          "bop","pon","com","fod","hom","rof","jom","loz",
          "fug","tup","sug","lun","sud","hux","gud","muv"]
});
</script>
</body>
</html>
