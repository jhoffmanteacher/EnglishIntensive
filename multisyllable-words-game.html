<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content-Security-Policy — identical to index.html's policy; the
     comment there explains what each directive is protecting. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>Multisyllable Words — Say It Right!</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="blend-game.css">
</head>
<body>
<a class="home" href="index.html">🏠 Home</a>
<div id="app"></div>

<script src="blend-game.js"></script>
<script>
// Two- and three-syllable words, from the classroom flashcard set. No
// single blend to highlight, so this uses blendLength:0 (an always-empty
// blend) for plain whole-word matching.
//
// Entries are marked with middle dots at their dictionary syllable
// boundaries (closed-syllable VC/CV division) — the engine strips these
// before matching, speaking or storing the word, and uses them only to
// scaffold the reveal after a second miss. "soft" is one syllable, so it's
// left undotted.
BlendGame.start({
  title: "Multisyllable Words 🏗️",
  intro: "Break the word into syllables. Say each part, then say the whole word.<br>The computer listens and tells you if you're right.",
  blend: "start",
  blendLength: 0,
  theme: "race",
  words: ["soft","pub·lic","gob·lin","fab·ric","gos·sip","nap·kin","sun·lit","sub·mit","an·tic",
          "on·set","sub·set","hub·cap","pic·nic","at·tic","un·til","cab·in","in·dex","mas·cot",
          "un·fit","hab·it","pan·ic","ex·am","hec·tic","com·ic","vic·tim","rob·in","muf·fin",
          "bob·bin","up·set","fan·tas·tic","vol·can·ic","in·hib·it","mag·net·ic","in·hab·it",
          "dis·gust·ed","max·i·mum","min·i·mum"]
});
</script>
</body>
</html>
