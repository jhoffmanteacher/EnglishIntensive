<!-- Match It for any list in the library: the computer says a word and
     the student finds it among look-alikes. One page for every family —
     which list to play comes from the address. Separate stats from the
     same list's other modes, because knowing a word on sight and picking
     it out of six are different skills.

     the student's record, the shared core, this page's engine, and then
     practice.js, which ties them together. -->

<script>

// one to play comes from the address — index.html links here with

// chooser of this student's Match It lists instead.
EIPractice.play();
