<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Build-time check, not part of the site. Served from tools/ so it can
     never be linked from a game page by accident; the scripts load with
     ../ paths.

     tests.html covers the pure logic. This covers the thing tests.html
     structurally cannot: that each engine's start() actually builds its
     screens against the real word lists, and that a few clicks through
     one don't throw. Every bug this has caught so far was the same shape
     — a listener bound to an element before the shell existed — which no
     amount of pure-function testing would have found.

     Run: tools/boot-check.sh -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self'; base-uri 'self'; object-src 'none';
  img-src 'self' data: https:; media-src 'self' blob:; font-src 'self' data:;
  style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self';">
<title>engine boot check</title>
<link rel="stylesheet" href="../site.css">
<link rel="stylesheet" href="../blend-game.css">
</head>
<body>
<div id="app"></div>
<pre id="out" style="padding:20px;font-size:14px;line-height:1.7"></pre>

<!-- EI_REQUIRE_AUTH switches auth.js into its no-wall mode, the same way
     tests.html does — this page has no account and needs none. -->
<script>window.EI_REQUIRE_AUTH = false;</script>
<script src="../adaptive.js"></script>
<script src="../word-lists.js"></script>
<script src="../auth.js"></script>
<script src="../store.js"></script>
<script src="../game-core.js"></script>
<script src="../listen.js"></script>
<script src="../blend-game.js"></script>
<script src="../spell-game.js"></script>
<script src="../card-game.js"></script>
<script src="../match-game.js"></script>
<script src="../fluency-game.js"></script>
<script src="../blend-it-game.js"></script>
<script>
(function(){
  "use strict";

  /* ONE engine per page load, named by ?g=. The engines all use the same
     element ids (s-start, s-play…) because each one owns its page, and
     they leave timers running — so two in one document would drive each
     other's screens, and tearing one down would leave its timers firing
     at elements that are gone. A page load each is the only honest
     isolation, and tools/check-pages.sh runs them in a loop. */
  var GAMES = {
    "say":        { engine: "BlendGame",   list: "initial-blends" },
    "say-red":    { engine: "BlendGame",   list: "red-1-say" },

    /* Noise that was never an attempt at the word must not cost a try —
       two of them and a student is shown the answer to a word they never
       tried to read. Driven with a fake recogniser, and the second half
       matters as much as the first: a genuinely wrong word must still
       count, or the fix has just switched the check off. */
    "say-noise": { engine: "BlendGame", list: "initial-blends",
      fake: true, drive: function(q, click, wait){
        click(q("#btnStart"));
        q("#btnPlay").disabled = false;   // the mic check's promise hasn't settled
        click(q("#btnPlay"));
        // The click sound holds the mic shut for a beat, so the engine
        // hasn't opened a recogniser yet.
        return wait(400).then(function(){
        var rec = window.FakeSR.last;
        if(!rec) throw new Error("the engine never opened a recogniser");
        var word = q("#uiWord").textContent;

        rec.emit(0, "um", true);
        if(q("#wordCard").className !== "wordcard"){
          throw new Error("a filler was scored as a miss");
        }
        rec.emit(0, "er hmm", true);
        if(q("#wordCard").className !== "wordcard"){
          throw new Error("fillers were scored as a miss");
        }

        // A real wrong answer, which must still land.
        rec.emit(0, word === "crab" ? "shrimp" : "crab", true);
        if(q("#wordCard").className.indexOf("wrong") === -1){
          throw new Error("a wrong word stopped counting as a miss");
        }
        });
      } },
    "spell":      { engine: "SpellGame",   list: "oi-oy-spell", drive: function(q, click){
                      click(q("#btnStart"));
                      // Two wrong answers, to reach the sound-box reveal.
                      q("#sbox0").value = "z";
                      click(q("#btnCheck"));
                      q("#sbox0").value = "z";
                      click(q("#btnCheck"));
                    } },
    "cards":      { engine: "CardGame",    list: "red-1-cards", drive: function(q, click){
                      click(q("#btnStart"));
                      click(q("#btnFlip"));
                      click(q("#btnGot"));
                    } },
    "cards-nonsense": { engine: "CardGame", list: "nonsense-1-cards", drive: function(q, click){
                      click(q("#btnStart"));
                      click(q("#btnFlip"));
                      click(q("#btnMiss"));
                    } },
    "split":      { engine: "CardGame",    list: "multi-1-split", drive: function(q, click){
                      click(q("#btnStart"));
                      click(q("#uiWord .gap"));   // place a divider
                      click(q("#btnFlip"));       // check it
                    } },
    "match":      { engine: "MatchGame",   list: "oi-oy-1-match", drive: function(q, click){
                      click(q("#btnStart"));
                      click(q(".tile"));
                    } },
    "fluency":    { engine: "FluencyGame", list: "blends-end-1-fluency" },

    /* The one mic path that CAN be driven headlessly, and the one worth
       driving: Chrome revises its interim results, and a word scored
       wrong on a guess it is about to withdraw has to be un-scored. A
       fake recogniser stands in for Chrome's; everything downstream of
       onresult is the real engine. */
    "fluency-revision": { engine: "FluencyGame", list: "blends-end-1-fluency",
      fake: true, drive: function(q, click){
        click(q("#btnStart"));
        // The mic check enables Start Reading from a getUserMedia
        // promise, which hasn't settled yet in a synchronous drive.
        q("#btnPlay").disabled = false;
        click(q("#btnPlay"));
        var rec = window.FakeSR.last;
        if(!rec) throw new Error("the engine never opened a recogniser");
        var w = [q("#wg0").textContent, q("#wg1").textContent, q("#wg2").textContent];

        // An interim that gets one of the three words wrong…
        rec.emit(0, w[0] + " zzzz aaaa bbbb", false);
        if(q("#uiWrong").textContent === "0") throw new Error("the interim scored nothing");

        // …then Chrome revises it to what was actually said.
        rec.emit(0, w.join(" "), true);
        if(q("#uiRight").textContent !== "3"){
          throw new Error("after the revision, read = " + q("#uiRight").textContent + ", wanted 3");
        }
        if(q("#uiWrong").textContent !== "0"){
          throw new Error("the withdrawn guess left " + q("#uiWrong").textContent + " errors behind");
        }
      } },
    "blendit":    { engine: "BlendItGame", list: "nonsense-1-blendit" }
  };

  /* Stands in for Chrome's SpeechRecognition. Only what the engine
     touches: the handlers it assigns, and results shaped the way
     onresult reads them. */
  function FakeSR(){ FakeSR.last = this; }
  FakeSR.prototype.start = function(){};
  FakeSR.prototype.stop = function(){};
  FakeSR.prototype.abort = function(){};
  FakeSR.prototype.emit = function(index, text, isFinal){
    var results = [];
    results.length = index + 1;
    results[index] = [{ transcript: text }];
    results[index].isFinal = !!isFinal;
    if(this.onresult) this.onresult({ resultIndex: index, results: results });
  };
  window.FakeSR = FakeSR;

  function param(){
    var m = /[?&]g=([^&#]+)/.exec(location.search || "");
    return m ? decodeURIComponent(m[1]) : "";
  }

  function say(text){
    document.title = text;
    document.getElementById("out").textContent = text + "\n\n" + Object.keys(GAMES).join("\n");
  }

  var name = param();
  if(!name){ say("pick one: " + Object.keys(GAMES).join(", ")); return; }
  var g = GAMES[name];
  if(!g){ say("FAILED: no game called " + name); return; }
  var engine = window[g.engine];
  if(!engine){ say("FAILED: " + g.engine + " did not load"); return; }

  // The cfg practice.js would build, minus the scheduler.
  var l = window.WordLists.byId(g.list);
  if(!l){ say("FAILED: no list called " + g.list); return; }
  var cfg = { mount: "app", title: l.title, intro: l.config.intro || "x" };
  for(var k in l.config){ if(Object.prototype.hasOwnProperty.call(l.config, k)) cfg[k] = l.config[k]; }
  cfg.words = l.words.slice(0, 8);
  cfg.mastered = window.WordLists.wordsOf(g.list).slice(0, 8);
  if(l.text) cfg.text = l.text;
  if(l.targets) cfg.targets = l.targets;

  // Before start(), because the engine reads it there.
  if(g.fake){ window.SpeechRecognition = FakeSR; window.webkitSpeechRecognition = FakeSR; }

  try{ engine.start(cfg); }
  catch(e){ say("FAILED: " + name + " start — " + e.message); return; }

  if(!g.drive){ say("ok: " + name); return; }
  function q(sel){
    var el = document.querySelector(sel);
    if(!el) throw new Error("no " + sel);
    return el;
  }
  function click(el){ el.click(); }
  /* A drive may return a promise. Some of these games hold the mic shut
     for a moment after a click sound, and a synchronous drive would fire
     into that gap and see nothing; --virtual-time-budget lets the timer
     run before the DOM is read. */
  function wait(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
  say("running: " + name);
  Promise.resolve()
    .then(function(){ return g.drive(q, click, wait); })
    .then(function(){ say("ok: " + name + " (driven)"); })
    .catch(function(e){ say("FAILED: " + name + " drive — " + e.message); });
})();
</script>
</body>
</html>
