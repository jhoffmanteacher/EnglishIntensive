     comment there explains what each directive is protecting. -->

  default-src 'self';

  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>Red Words — Read It, Flip It</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="blend-game.css">
</head>
<body>
<a class="home" href="index.html">🏠 Home</a>
<div id="app"></div>

<script src="game-core.js"></script>
<script src="card-game.js"></script>
<script>
// The ten high-frequency irregular-word lists from the SUHSD "red word"
// screener, twenty words each, in the order they're printed. The source of
// record — where the lists came from, how the paper screener scores them and
// why a few words repeat — is data/red-words.md; the arrays below are that
// file transcribed, so any correction belongs in both places.
//
// These are the words English lies to you about: sounding out "said",
// "would" or "Wednesday" gets you the wrong word every time, so they have to
// be known on sight. That's why the flash-card format fits them and the
// site's other two engines don't — there's no rule to apply, no blend to
// isolate, nothing to sound out. Read it or you don't.
//
// Words are kept exactly as printed, punctuation and all (Mrs., Mr.,
// they'd, you're). Nothing here is ever matched against typing or speech, so
// the apostrophes and periods cost nothing — and the computer says "Mrs."
// correctly when the card is flipped.
CardGame.start({
  title: "Red Words 🃏",
  intro: "No mic, no typing. A word shows — read it out loud, flip the card, and see if you were right.<br>Build a streak: every 5 in a row is bonus points!",
  note: `
    <p><b>Red words</b> are the words that break the rules. Sounding out
    <b>said</b> gives you "sayed". Sounding out <b>would</b> gives you
    "wold". They don't play fair — so you learn them <b>by sight</b>,
    the way you know a friend's face.</p>
    <p>Be honest when you rate yourself. A word you mark <b>Not yet</b> comes
    back next time; a word you mark <b>Got it</b> leaves the list for good.</p>`,
  decks: [
    { name: "List 1", words: ["you","should","could","said","they","have","of","are","what","put",
                              "would","to","your","was","the","once","do","from","into","two"] },
    { name: "List 2", words: ["give","were","many","whose","any","here","live","some","Mrs.","Mr.",
                              "where","other","one","whom","right","there","done","great","does","their"] },
    { name: "List 3", words: ["thought","who","come","very","again","aren't","weren't","mother","father","brother",
                              "watch","haven't","they'd","you'd","against","friend","they'll","we're","they're","you're"] },
    { name: "List 4", words: ["beautiful","been","blood","none","only","says","sure","both","bought","buy",
                              "prove","straight","worn","push","today","pull","most","change","child","clothes"] },
    { name: "List 5", words: ["flood","floor","often","door","gone","laugh","break","steak","above","they've",
                              "you","lose","tough","view","rough","front","love","among","anyone","answer"] },
    { name: "List 6", words: ["nothing","cousins","cover","courage","toward","enough","through","sugar","busy","almost",
                              "ninth","although","always","another","onion","though","people","build","piano","pint"] },
    { name: "List 7", words: ["shoved","butcher","post","pretty","canoe","promise","carrot","cough","roll","danger",
                              "debt","sew","shoe","heart","forward","son","four","spirit","swan","bouquet"] },
    { name: "List 8", words: ["honest","toll","honor","touch","hour","Tuesday","Wednesday","imagine","iron","wind",
                              "wolf","won","wore","move","minute","mirror","young","success","already","idea"] },
    { name: "List 9", words: ["music","sure","garage","system","figure","friend","national","ready","island","unique",
                              "ocean","radio","feature","continue","condition","caution","enough","guarantee","technique","anxious"] },
    { name: "List 10", words: ["cologne","resumé","resume","boutique","fair","pair","fought","eye","show","small",
                               "about","call","fall","mall","air","know","large","barge","house","mouse"] }
  ]
});
</script>
</body>
</html>
