# The checks from CLAUDE.md's "Before committing", on every push and pull request.
# run-tests.sh, check-pages.sh and boot-check.sh always exit 0 (they are made to be
# read by a person), so each step greps their output for the line that means "good".
name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Serve the site
        run: |
          python3 -m http.server 8000 >/dev/null 2>&1 &
          for i in $(seq 1 20); do curl -fsS http://localhost:8000/ >/dev/null && exit 0; sleep 0.5; done
          echo "the server did not start"; exit 1

      - name: tests.html (N/N passing, uncaught 0)
        run: |
          out=$(CHROME=google-chrome bash tools/run-tests.sh)
          echo "$out"
          line=$(printf '%s\n' "$out" | grep -E '^[0-9]+/[0-9]+ passing$' | head -1)
          [ -n "$line" ] || { echo "no 'N/N passing' line"; exit 1; }
          pass=${line%%/*}; rest=${line#*/}; total=${rest%% *}
          [ "$pass" = "$total" ] || { echo "not all passing: $line"; exit 1; }
          printf '%s\n' "$out" | grep -qx 'uncaught: 0' || { echo "uncaught errors"; exit 1; }

      - name: check-pages.sh (pages clean)
        run: |
          out=$(CHROME=google-chrome bash tools/check-pages.sh)
          echo "$out"
          printf '%s\n' "$out" | grep -q '^pages clean' || exit 1

      - name: boot-check.sh (engines ok)
        run: |
          out=$(CHROME=google-chrome bash tools/boot-check.sh)
          echo "$out"
          printf '%s\n' "$out" | grep -q '^engines ok' || exit 1

      - name: save-loop.mjs (the closed loop)
        run: node tools/save-loop.mjs

      # Serves the site itself on a free port; needs no server step.
      - name: sequence-loop.mjs (the second closed loop)
        run: CHROME=google-chrome node tools/sequence-loop.mjs

      - name: listen-loop.mjs (false rejects / false accepts, pinned)
        run: CHROME=google-chrome node tools/listen-loop.mjs
