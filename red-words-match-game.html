<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content-Security-Policy — identical to index.html's policy; the
     comment there explains what each directive is protecting. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>Red Words: Match It — moved</title>
<script src="view-boot.js"></script>
<link rel="stylesheet" href="site.css">
</head>
<body>
<!-- ── A forwarding address ──────────────────────────────────────────────
     Red-word Match It used to live on this page, back when the red words were the
     only family with more than one mode. Every list can be played that
     way now, so the page became a generic one — match-game.html — and this
     is what's left: a redirect that carries the ?list= across.

     It stays because students bookmark game pages and write them on
     paper, and a dead link mid-class costs more than a six-line file.
     No sign-in and no engine here on purpose: this page decides nothing,
     it only forwards, and match-game.html does the real work. -->
<p class="sub" style="max-width:520px;margin:60px auto;padding:0 20px">
  This game moved. <a id="go" href="match-game.html">Carry on here →</a>
</p>
<script>
(function(){
  var to = "match-game.html" + (location.search || "");
  document.getElementById("go").href = to;
  // replace(), not assign(): Back should return to wherever the student
  // came from, not bounce off this page and forward again.
  location.replace(to);
})();
</script>
</body>
</html>
