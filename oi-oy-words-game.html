<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content-Security-Policy — identical to index.html's policy; the
     comment there explains what each directive is protecting. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>oi/oy Words — Say It Right!</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="blend-game.css">
</head>
<body>
<a class="home" href="index.html">🏠 Home</a>
<div id="app"></div>

<script src="blend-game.js"></script>
<script>
// The oi/oy diphthong — it can land anywhere in the word (start "oink",
// middle "coin", end "annoy"), so this uses "sound" mode instead of a fixed
// start/end blend: the OY phoneme must be exactly right wherever it falls,
// and "highlight" just shows the student which letters spell it.
BlendGame.start({
  title: "oi/oy Words 🪙",
  blend: "sound",
  sound: "OY",
  highlight: /oi|oy/i,
  theme: "maze",
  words: ["annoy","appoint","avoid","boyish","broil","choice","cloying","coil","coin",
          "convoy","coy","decoy","deploy","destroy","devoid","droid","employ","enjoy",
          "foil","hoist","join","joint","loyal","moist","noise","poison","ploy","royal",
          "soil","soy","spoil","toil","void"]
});
</script>
</body>
</html>
