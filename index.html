<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content-Security-Policy. Every page on the site carries this same policy;
     the game pages point back here for the explanation.

     default-src 'self'   nothing loads from anywhere but this origin unless a
                          directive below widens it
     base-uri 'self'      an injected <base> can't re-point every relative URL
     object-src 'none'    no Flash/Java/embed plugins, ever
     img-src / media-src  images may come from https or data: URIs; audio and
                          video only from here or blob: (the mic stream)
     font-src / style-src / script-src
                          'unsafe-inline' is required because these pages carry
                          their game config in an inline <script> and a few
                          inline style attributes; the Google origins are here
                          so a page can pull in a Google font or a Drive embed
     connect-src          XHR/fetch/WebSocket targets, kept to this origin plus
                          Google/Firebase in case a game ever saves progress
     frame-src            what may be embedded in an iframe — currently used
                          for YouTube and Drive/Docs viewers -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>English Intensive — Games</title>
<link rel="stylesheet" href="site.css">
<style>
  /* Home page only — tokens, the reset and the button system are in site.css. */
  body{padding:40px 20px 60px}
  .wrap{width:100%;max-width:1000px;margin:0 auto}
  header{margin-bottom:32px}
  h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px;letter-spacing:-.5px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
  }
  .tile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:24px;
    padding:26px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    transition:transform .15s ease, border-color .15s ease;
  }
  .tile:hover{transform:translateY(-4px);border-color:var(--accent)}
  .tile .icon{font-size:44px;margin-bottom:14px;line-height:1}
  .tile h2{font-size:22px;margin:0 0 8px;letter-spacing:-.2px}
  .tile p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 20px;flex:1}
  .tile .play{
    align-self:flex-start;
    background:var(--accent);color:#1a1206;font-weight:700;
    font-size:15px;padding:10px 20px;border-radius:12px;
  }

  .empty{
    color:var(--muted);font-size:16px;line-height:1.7;
    background:var(--panel);border:1px solid var(--line);border-radius:24px;
    padding:26px 24px;
  }

  .section{margin-bottom:40px}
  .section:last-child{margin-bottom:0}
  /* Child combinator, not a descendant selector — a bare ".section h2" would
     also match each tile's own <h2> title nested inside .grid and override
     its font-size. */
  .section > h2{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
  .section > .sectionNote{color:var(--muted);font-size:15px;margin:0 0 18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>English Intensive 🎮</h1>
    <p class="sub">Pick a game to practice.</p>
  </header>

  <div id="sections"></div>
</div>

<script>
(function(){
  "use strict";

  // "speak" games use the mic (blend-game.js) — the student says the word
  // out loud. "type" games are mic-free (spell-game.js) — the computer
  // says the word and the student types it. Split into sections below so
  // a student in a loud room, or without a working mic, can go straight to
  // games that'll actually work for them.
  var SECTIONS = [
    {
      key: "speak",
      title: "🎤 Speaking Games",
      note: "Put on a mic and say each word out loud.",
      games: [
        {
          icon: "🎤",
          title: "Blend Words",
          description: "Read a word that ends with a consonant blend out loud. The computer listens and tells you if you said it right. Build a streak for bonus points!",
          url: "blend-words-game.html"
        },
        {
          icon: "🗣️",
          title: "Starting Blends",
          description: "Words that begin with a consonant blend — bl, cr, sl, tr. Say each one out loud and the computer checks you.",
          url: "initial-blends-game.html"
        },
        {
          icon: "🤖",
          title: "Nonsense Words",
          description: "Made-up CVC words with no meaning to lean on — pure sounding-out practice. Say each one out loud and the computer checks you.",
          url: "nonsense-words-game.html"
        },
        {
          icon: "🪙",
          title: "oi/oy Words",
          description: "Words with the oi/oy sound — coin, join, annoy, royal. Say each one out loud and the computer checks you.",
          url: "oi-oy-words-game.html"
        },
        {
          icon: "🏗️",
          title: "Multisyllable Words",
          description: "Two- and three-syllable words like napkin, picnic and fantastic. Say each one out loud and the computer checks you.",
          url: "multisyllable-words-game.html"
        }
      ]
    },
    {
      key: "type",
      title: "⌨️ Typing Games",
      note: "No mic — just headphones. The computer says a word and you type it.",
      games: [
        {
          icon: "⌨️",
          title: "Spell It: oi/oy",
          description: "No mic — headphones only. The computer says a word and you type it. Learn when the /oy/ sound is spelled oi and when it's oy.",
          url: "spelling-oi-oy-game.html"
        }
      ]
    }
  ];

  var sectionsEl = document.getElementById("sections");

  var totalGames = SECTIONS.reduce(function(n, s){ return n + s.games.length; }, 0);
  if(!totalGames){
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No games yet — check back soon!";
    sectionsEl.appendChild(empty);
    return;
  }

  SECTIONS.forEach(function(section){
    if(!section.games.length) return;

    var wrap = document.createElement("div");
    wrap.className = "section";

    var h2 = document.createElement("h2");
    h2.textContent = section.title;
    wrap.appendChild(h2);

    var note = document.createElement("p");
    note.className = "sectionNote";
    note.textContent = section.note;
    wrap.appendChild(note);

    var grid = document.createElement("div");
    grid.className = "grid";

    section.games.forEach(function(game){
      var tile = document.createElement("a");
      tile.className = "tile";
      tile.href = game.url;

      var icon = document.createElement("div");
      icon.className = "icon";
      icon.textContent = game.icon;

      var title = document.createElement("h2");
      title.textContent = game.title;

      var p = document.createElement("p");
      p.textContent = game.description;

      var play = document.createElement("span");
      play.className = "play";
      play.textContent = "Play ▸";

      tile.appendChild(icon);
      tile.appendChild(title);
      tile.appendChild(p);
      tile.appendChild(play);
      grid.appendChild(tile);
    });

    wrap.appendChild(grid);
    sectionsEl.appendChild(wrap);
  });
})();
</script>
</body>
</html>
