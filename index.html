<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>English Intensive — Games</title>
<style>
  :root{
    --bg:#111827;
    --panel:#1b2437;
    --panel2:#232f46;
    --ink:#f4f7fb;
    --muted:#9fb0c9;
    --accent:#ffc94d;
    --good:#3ddc97;
    --line:#31405c;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;
    background:radial-gradient(1200px 700px at 50% -10%, #1e2a44 0%, var(--bg) 60%);
    color:var(--ink);
    font-family:"Verdana","Trebuchet MS","Segoe UI",system-ui,sans-serif;
    padding:40px 20px 60px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{width:100%;max-width:1000px;margin:0 auto}
  header{margin-bottom:32px}
  h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px;letter-spacing:-.5px}
  .sub{color:var(--muted);font-size:17px;line-height:1.6;margin:0}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
  }
  .tile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:24px;
    padding:26px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    transition:transform .15s ease, border-color .15s ease;
  }
  .tile:hover{transform:translateY(-4px);border-color:var(--accent)}
  .tile .icon{font-size:44px;margin-bottom:14px;line-height:1}
  .tile h2{font-size:22px;margin:0 0 8px;letter-spacing:-.2px}
  .tile p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 20px;flex:1}
  .tile .play{
    align-self:flex-start;
    background:var(--accent);color:#1a1206;font-weight:700;
    font-size:15px;padding:10px 20px;border-radius:12px;
  }

  .empty{
    color:var(--muted);font-size:16px;line-height:1.7;
    background:var(--panel);border:1px solid var(--line);border-radius:24px;
    padding:26px 24px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>English Intensive 🎮</h1>
    <p class="sub">Pick a game to practice.</p>
  </header>

  <div class="grid" id="gameGrid"></div>
</div>

<script>
(function(){
  "use strict";

  var GAMES = [
    {
      icon: "🎤",
      title: "Blend Words",
      description: "Read a word that ends with a consonant blend out loud. The computer listens and tells you if you said it right. Build a streak for bonus points!",
      url: "blend-words-game.html"
    },
    {
      icon: "🗣️",
      title: "Starting Blends",
      description: "Words that begin with a consonant blend — bl, cr, sl, tr. Say each one out loud and the computer checks you.",
      url: "initial-blends-game.html"
    }
  ];

  var grid = document.getElementById("gameGrid");

  if(!GAMES.length){
    var empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "No games yet — check back soon!";
    grid.appendChild(empty);
    return;
  }

  GAMES.forEach(function(game){
    var tile = document.createElement("a");
    tile.className = "tile";
    tile.href = game.url;

    var icon = document.createElement("div");
    icon.className = "icon";
    icon.textContent = game.icon;

    var h2 = document.createElement("h2");
    h2.textContent = game.title;

    var p = document.createElement("p");
    p.textContent = game.description;

    var play = document.createElement("span");
    play.className = "play";
    play.textContent = "Play ▸";

    tile.appendChild(icon);
    tile.appendChild(h2);
    tile.appendChild(p);
    tile.appendChild(play);
    grid.appendChild(tile);
  });
})();
</script>
</body>
</html>
