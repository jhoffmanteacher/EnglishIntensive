<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content-Security-Policy. Every page on the site carries this same policy;
     the game pages point back here for the explanation.

     default-src 'self'   nothing loads from anywhere but this origin unless a
                          directive below widens it
     base-uri 'self'      an injected <base> can't re-point every relative URL
     object-src 'none'    no Flash/Java/embed plugins, ever
     img-src / media-src  images may come from https or data: URIs; audio and
                          video only from here or blob: (the mic stream)
     font-src / style-src / script-src
                          'unsafe-inline' is required because these pages carry
                          their game config in an inline <script> and a few
                          inline style attributes; the Google origins are here
                          so a page can pull in a Google font or a Drive embed
     connect-src          XHR/fetch/WebSocket targets, kept to this origin plus
                          Google/Firebase in case a game ever saves progress
     frame-src            what may be embedded in an iframe — currently used
                          for YouTube and Drive/Docs viewers -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>English Intensive — Games</title>
<script src="view-boot.js"></script>
<link rel="stylesheet" href="site.css">
<style>
  /* Home page only — tokens, the reset and the button system are in site.css. */
  body{padding:40px 20px 60px}
  .wrap{width:100%;max-width:1000px;margin:0 auto}
  header{margin-bottom:32px}
  h1{font-size:clamp(30px,5vw,46px);margin:0 0 8px;letter-spacing:-.5px}

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:20px;
  }
  .tile{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:24px;
    padding:26px 24px;
    box-shadow:0 24px 60px rgba(0,0,0,.45);
    display:flex;
    flex-direction:column;
    text-decoration:none;
    color:inherit;
    transition:transform .15s ease, border-color .15s ease;
  }
  .tile:hover{transform:translateY(-4px);border-color:var(--accent)}
  .tile .icon{font-size:44px;margin-bottom:14px;line-height:1}
  .tile h2{font-size:22px;margin:0 0 8px;letter-spacing:-.2px}
  .tile p{color:var(--muted);font-size:15px;line-height:1.55;margin:0 0 20px;flex:1}
  .tile .play{
    align-self:flex-start;
    background:var(--accent);color:#1a1206;font-weight:700;
    font-size:15px;padding:10px 20px;border-radius:12px;
  }

  /* Per-list progress on the tile — how much of that list is solid.
     Words mastered rather than a score: this is a practice deck, and a
     percentage next to a student's name reads as a grade. */
  .tileProg{margin:0 0 18px}
  .tileProg .bar{
    height:7px;border-radius:99px;background:var(--panel2);
    overflow:hidden;margin-bottom:7px;
  }
  .tileProg .bar span{display:block;height:100%;background:var(--good);border-radius:99px}
  .tileProg .progNote{color:var(--muted);font-size:13px}
  .tileProg .progNote b{color:var(--accent)}

  /* A list tile ("Red Words · List 3", "Blend Words"): a <div>, not a
     link, holding one row per mode the student has for that list. Each
     row is its own link. */
  .tileFamily{cursor:default}
  .tileFamily:hover{transform:none;border-color:var(--line)}
  .tileFamily p{margin-bottom:14px;font-style:italic}
  .tileFamily .gameRow{
    display:flex;align-items:center;gap:12px;
    padding:12px 12px;margin:0 -6px 8px;
    border:1px solid var(--line);border-radius:14px;
    color:inherit;text-decoration:none;
    transition:border-color .15s ease, background .15s ease;
  }
  .tileFamily .gameRow:hover{border-color:var(--accent);background:var(--panel2)}
  .tileFamily .gameRow:last-child{margin-bottom:0}
  .tileFamily .gIcon{font-size:26px;line-height:1;flex:none}
  .tileFamily .gMeta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
  .tileFamily .gTitle{font-weight:700;font-size:15px}
  /* What the mode needs at the desk. Two of the four want headphones and
     one wants a mic, and a student picking a game on a Chromebook with
     neither should find that out here rather than on the start screen. */
  .tileFamily .gNeeds{
    font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--muted);border:1px solid var(--line);border-radius:99px;
    padding:1px 7px;margin-left:8px;vertical-align:1px;
  }
  .tileFamily .gProg{color:var(--muted);font-size:12.5px}
  .tileFamily .gProg b{color:var(--accent)}
  .tileFamily .gameRow .play{padding:8px 14px;font-size:14px;flex:none}

  .teacherLink{
    display:none;margin-top:26px;
    color:var(--muted);font-size:14px;text-decoration:none;
    border:1px dashed var(--line);border-radius:12px;padding:9px 15px;
  }
  .teacherLink:hover{border-color:var(--accent);color:var(--ink)}

  .empty{
    color:var(--muted);font-size:16px;line-height:1.7;
    background:var(--panel);border:1px solid var(--line);border-radius:24px;
    padding:26px 24px;
  }

  /* What a sequence just opened. One line, once, and only ever forward —
     see unlockBanner() in practice.js. */
  .unlockBanner{
    background:rgba(255,201,77,.12);border:1px solid rgba(255,201,77,.42);
    border-radius:14px;padding:12px 18px;margin:0 0 26px;
    font-size:17px;color:var(--ink);
  }
  .unlockBanner b{color:var(--accent)}
  .section{margin-bottom:40px}
  .section:last-child{margin-bottom:0}
  /* Child combinator, not a descendant selector — a bare ".section h2" would
     also match each tile's own <h2> title nested inside .grid and override
     its font-size. */
  .section > h2{font-size:20px;margin:0 0 4px;letter-spacing:-.2px}
  .section > .sectionNote{color:var(--muted);font-size:15px;margin:0 0 18px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>English Intensive 🎮</h1>
    <p class="sub">Pick a game to practice.</p>
  </header>

  <div id="sections"></div>
  <a class="teacherLink" id="teacherLink" href="teacher.html">Teacher dashboard →</a>
</div>

<!-- The tile grid is built from word-lists.js, filtered to the lists
     this student is assigned (EIStore.myLists), so two students in
     different groups see different games on this page. The registry holds
     one entry per (list × mode); they fold back into one tile per list,
     with a Play row per mode that student has been given. Adding a game,
     or another way to play an existing one, means editing word-lists.js —
     not this file. -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="adaptive.js"></script>
<script src="passages.js"></script>
<script src="word-lists.js"></script>
<script src="store.js"></script>
<script src="practice.js"></script>
<script>
EIPractice.renderHome("sections");
// The dashboard link is a convenience, not a gate — teacher.html checks
// the account itself, and firestore.rules refuses the data to anyone else.
EIAuth.ready().then(function(){
  if(EIAuth.isTeacher()) document.getElementById("teacherLink").style.display = "inline-block";
});
</script>
</body>
</html>
