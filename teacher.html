<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Content-Security-Policy — identical to index.html's policy; the
     comment there explains what each directive is protecting. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  media-src 'self' blob:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.youtube.com https://www.youtube-nocookie.com https://youtube.com https://docs.google.com https://drive.google.com https://www.google.com;
">
<title>Teacher Dashboard — English Intensive</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="teacher.css">
</head>
<body class="teacher">
<a class="home" href="index.html">🏠 Games</a>

<div class="twrap">
  <header class="thead">
    <h1>Teacher Dashboard</h1>
    <p class="sub" id="tSub">Loading…</p>
  </header>

  <nav class="tabs" id="tTabs" hidden>
    <button class="tab on" data-view="roster">Students</button>
    <button class="tab" data-view="assign">Assign</button>
    <button class="tab" data-view="groups">Periods &amp; Lists</button>
    <button class="tab" data-view="trouble">Trouble Spots</button>
  </nav>

  <div id="tBody"></div>
</div>

<!-- Same load order as every other page. teacher.js checks the signed-in
     account itself and shows a plain "not this account" panel rather than
     a broken table — but the check that MATTERS is in firestore.rules,
     which simply refuses to answer for anyone else. -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="adaptive.js"></script>
<script src="passages.js"></script>
<script src="word-lists.js"></script>
<script src="teacher.js"></script>
</body>
</html>
