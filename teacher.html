<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Light by default, dark when the computer is: teacher.css has both
     palettes. This tells the browser so its own scrollbars, selects and
     checkboxes follow. -->
<meta name="color-scheme" content="light dark">
<!-- Content-Security-Policy — index.html's policy, tightened: this page has
     no inline <script> or inline handlers (auth.js and teacher.js attach
     theirs with addEventListener), embeds no YouTube/Docs/Drive, and plays
     no audio. style-src keeps 'unsafe-inline' because teacher.js writes
     style attributes. The comment in index.html explains the rest. -->
<meta http-equiv="Content-Security-Policy" content="
  default-src 'self';
  base-uri 'self';
  object-src 'none';
  img-src 'self' data: https:;
  worker-src 'self' blob:;
  font-src 'self' data: https://fonts.gstatic.com https://www.gstatic.com;
  style-src 'self' 'unsafe-inline' https://www.gstatic.com https://fonts.googleapis.com;
  script-src 'self' https://www.gstatic.com https://apis.google.com;
  connect-src 'self' https://*.googleapis.com https://*.google.com https://*.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebaseapp.com;
  frame-src 'self' https://*.firebaseapp.com https://accounts.google.com https://content.googleapis.com https://www.google.com;
">
<title>Teacher Dashboard — English Intensive</title>
<link rel="stylesheet" href="site.css">
<link rel="stylesheet" href="teacher.css">
</head>
<body class="teacher">

<!-- The console: a grouped sidebar, a slim top bar, one view at a time.
     The nav and the top-bar tools stay hidden until teacher.js has
     checked the account and loaded the class. Icons are inline SVG
     (stroke, currentColor), so they need no font and no request. -->
<!-- The plum bar: the way back to the games at the left, and the signed-in
     chip at the right. auth.js fills #ei-user-chip when a page has one
     (and leaves it where it is rather than pinning it to the corner). -->
<header class="tBar">
  <a class="tBarBrand" href="index.html" title="Back to the games">English Intensive</a>
  <div id="ei-user-chip" class="tChip" hidden></div>
</header>

<div class="tShell">
  <aside class="tSide">
    <nav id="tNav" aria-label="Dashboard" hidden>
      <div class="tGroup">
        <h2 class="tGroupHead">Students</h2>
        <button type="button" class="tNav" data-view="roster">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><circle cx="17" cy="9" r="2.5"/><path d="M17 14.5c2.3 0 4 1.5 4.6 4"/></svg>
          <span>Students</span></button>
        <button type="button" class="tNav" data-view="trouble">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l10 18H2z"/><path d="M12 10v5"/><path d="M12 18h.01"/></svg>
          <span>Trouble spots</span></button>
      </div>
      <div class="tGroup">
        <h2 class="tGroupHead">Set up</h2>
        <button type="button" class="tNav" data-view="groups">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
          <span>Classes</span></button>
        <button type="button" class="tNav" data-view="manage">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>
          <span>Manage</span></button>
      </div>
    </nav>
  </aside>

  <main class="tMain">
    <header class="tTop">
      <div class="tTitleBox">
        <h1 id="tTitle">Teacher Dashboard</h1>
        <p class="sub" id="tSub">Loading…</p>
      </div>
      <div class="tTools" id="tTools" hidden>
        <!-- The class filter. teacher.js draws the buttons. -->
        <div class="seg" id="tFilter" role="group" aria-label="Class"></div>
        <button type="button" class="btn ghost sm" id="tRefresh">Refresh</button>
        <button type="button" class="btn ghost sm" id="tPreview" aria-haspopup="dialog">Student view</button>
      </div>
    </header>

    <div id="tBody"></div>
  </main>
</div>

<!-- Same load order as every other page. teacher.js checks the signed-in
     account itself and shows a plain "not this account" panel rather than
     a broken table — but the check that MATTERS is in firestore.rules,
     which simply refuses to answer for anyone else. -->
<script src="firebase-config.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="auth.js"></script>
<script src="adaptive.js"></script>
<!-- The dashboard parses pasted rosters with GameCore.parseRoster, so the
     core has to be here too. It also applies reading-view classes to
     <html> on load, which the dashboard simply doesn't use. -->
<script src="game-core.js"></script>
<script src="word-lists.js"></script>
<script src="teacher.js"></script>
</body>
</html>
